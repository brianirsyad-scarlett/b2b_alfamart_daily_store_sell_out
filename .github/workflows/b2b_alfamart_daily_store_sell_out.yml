name: B2B Alfamart Daily Store Sell Out

on:
  schedule:
    # Runs at 07:00 UTC (14:00 Jakarta) and 22:00 UTC (05:00 Jakarta next day)
    - cron: '0 7,22 * * *'
  workflow_dispatch:  # Allows manual trigger from Actions tab

jobs:
  run-script:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium pyotp webdriver-manager pytz

      - name: Run B2B Alfamart Daily Store Sell Out
        env:
          TOTP_SECRET_KEY: ${{ secrets.TOTP_SECRET_KEY }}
        run: python b2b_alfamart_daily_store_sell_out.py
